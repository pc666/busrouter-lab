function showCode(){
 const s=sources[$('symbol').value];
 $('code').textContent=s.lines.map((t,i)=>String(s.start+i).padStart(4)+'  '+t).join('\n');
 $('permalink').href='https://github.com/pc666/soft_floorplan/blob/63a9cb53f5d472c327d104c1064667f46d481d59/for-copy/'+s.file+'#L'+s.start+'-L'+(s.start+s.lines.length-1);
}
function render(keepSource=false){
 const d=records[$('wall').value+'-'+$('pitch').value+'-'+$('mode').value],p=Number($('pitch').value),s=lesson(d,p);
 $('menu').value=step;$('chapter').textContent=chapters[step];$('title').textContent=s.title;$('idea').textContent=s.idea;
 $('states').innerHTML=s.states.map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('');
 $('board').innerHTML=s.view;$('caption').textContent=s.caption;$('legend').textContent=s.legend;$('reason').textContent=s.reason;
 $('vizTitle').textContent=['调用与数据流','6 个 bit 的去向','G1 的两个 guide','对象关系','G0 的实际直线','双端 L 型旁例','第一次接端 · 目标 B','第二次接端 · 目标 C','本次运行的提交结果','已提交的几何','调试练习'][step];
 $('scope').textContent=step===5?'固定旁例':step>=2&&step<10?'主例 · 24 × 30 µm':'';
 $('settings').hidden=![2,3,4,6,7,8,9].includes(step);
 $('question').textContent=s.question.title;
 $('answers').innerHTML=s.question.opts.map((a,i)=>'<button data-answer="'+i+'" aria-pressed="'+(chosen===i)+'">'+esc(a)+'</button>').join('');
 $('feedback').textContent=chosen<0?'':(chosen===s.question.answer?'答对了。':'再想一层。')+s.question.why;
 if(!keepSource){$('symbol').innerHTML=s.src.map(k=>'<option value="'+k+'">'+esc(sources[k].label)+'</option>').join('');showCode()}
 $('position').textContent='第 '+(step+1)+' / '+labels.length+' 步';$('prev').disabled=step===0;$('next').disabled=step===labels.length-1;
 const micro=$('micro');
 if(step===6||step===7){
  const max=d.frames[step-6].POP.length+1;
  if(!micro.firstElementChild)micro.innerHTML='<div class="micro"><button id="backNode">上一格</button><input id="tick" type="range" min="0" aria-label="A* 展开序号"><button id="nextNode">下一格</button><button id="endNode">到回溯</button></div><small id="frameLabel"></small>';
  $('tick').max=max;$('tick').value=tick;$('backNode').disabled=tick===0;$('nextNode').disabled=tick===max;$('endNode').disabled=tick===max;
  $('frameLabel').textContent=tick===max?'本次接端结束':'已展开 '+tick+' / '+(max-1)+' 个节点';
 }else micro.replaceChildren();
}
function go(i){step=i;tick=0;chosen=-1;$('source').open=false;$('why').open=false;render();try{history.replaceState(null,'','#step-'+(step+1))}catch{}}
$('menu').innerHTML=labels.map((s,i)=>'<option value="'+i+'">'+(i+1)+'　'+s+'</option>').join('');
$('menu').onchange=()=>go(Number($('menu').value));$('prev').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);
for(const id of ['wall','pitch','mode'])$(id).onchange=()=>{tick=0;chosen=-1;render(true)};
$('symbol').onchange=showCode;
$('answers').onclick=e=>{if(e.target.dataset.answer!==undefined){chosen=Number(e.target.dataset.answer);render(true)}};
$('micro').oninput=e=>{if(e.target.id==='tick'){tick=Number(e.target.value);render(true)}};
$('micro').onclick=e=>{if(!['backNode','nextNode','endNode'].includes(e.target.id))return;
 const max=Number($('tick').max);tick=e.target.id==='endNode'?max:Math.max(0,Math.min(max,tick+(e.target.id==='nextNode'?1:-1)));render(true)};
const initial=Number(location.hash.replace('#step-',''));go(Number.isInteger(initial)&&initial>0&&initial<=labels.length?initial-1:0);
